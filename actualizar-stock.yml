name: Actualizar stock

on:
  # Boton manual: Actions -> Actualizar stock -> Run workflow
  # (funciona desde el navegador o desde la app de GitHub en el celular)
  workflow_dispatch: {}

  # Ademas corre solo todos los dias a las 12:00 UTC (~08:00 o 09:00 en Chile,
  # segun horario de verano). Ajusta la hora si quieres.
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl requests

      - name: Generar data.json desde el Excel en Google Drive
        env:
          DRIVE_FILE_ID: ${{ vars.DRIVE_FILE_ID }}
        run: python exportar_stock_cloud.py

      - name: Subir el cambio si hubo diferencias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el stock, no se hace commit."
          else
            git commit -m "Actualizacion automatica de stock"
            git push
          fi
